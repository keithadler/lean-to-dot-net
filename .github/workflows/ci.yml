name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          # On Windows the runner reads GITHUB_PATH as a Windows path.
          if command -v cygpath >/dev/null; then cygpath -w "$HOME/.elan/bin" >> "$GITHUB_PATH"; else echo "$HOME/.elan/bin" >> "$GITHUB_PATH"; fi

      - name: Lean proofs
        working-directory: lean
        run: lake build

      - name: Tenet
        run: dotnet tool restore

      - name: lean2il
        run: dotnet build src/Lean2Il -c Release

      - name: Re-check everything with Tenet and emit the assembly
        # On one runner the check covers Lean's own library under the project too; the others check the project.
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then FLAGS=""; else FLAGS="--trust-imports"; fi
          dotnet src/Lean2Il/bin/Release/net10.0/lean2il.dll lean $FLAGS

      - name: Showcase (recursion, lists, options, strings)
        shell: bash
        run: |
          (cd examples/showcase && lake build)
          dotnet src/Lean2Il/bin/Release/net10.0/lean2il.dll examples/showcase --trust-imports

      - name: Tests
        run: dotnet test tests/LeanToDotNet.Tests -c Release --logger "console;verbosity=detailed"

      - name: Sample
        run: dotnet run --project samples/Invoice -c Release

      - name: NuGet packages, and a new project that builds Lean with them
        shell: bash
        run: |
          for p in src/Lean2Il src/LeanToDotNet.Runtime src/LeanToDotNet.Build; do dotnet pack "$p" -c Release -o artifacts; done
          tests/package-smoke.sh

      - name: VSIX
        if: matrix.os == 'ubuntu-latest'
        working-directory: vscode
        run: npx --yes @vscode/vsce@3 package --no-dependencies --baseContentUrl https://github.com/keithadler/lean-to-dot-net/blob/HEAD/vscode --baseImagesUrl https://github.com/keithadler/lean-to-dot-net/raw/HEAD/vscode

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: lean-to-dot-net
          path: |
            lean/.lake/dotnet/
            vscode/*.vsix
            artifacts/*.nupkg

  vscode:
    # The extension: unit tests, the package (with lean2il bundled), and the integration suite in a real VS Code.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean proofs, and a first assembly for the tests to look at
        run: |
          (cd lean && lake build)
          dotnet run --project src/Lean2Il -c Release -- lean --trust-imports

      - name: Unit tests
        working-directory: vscode
        run: npm ci && npm test

      - name: Package, with lean2il bundled
        working-directory: vscode
        run: npm run package

      - name: Integration tests in VS Code
        working-directory: vscode
        run: xvfb-run -a npm run test:integration

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix
