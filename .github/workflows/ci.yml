name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean proofs
        working-directory: lean
        run: lake build

      - name: Tenet
        run: dotnet tool restore

      - name: lean2il
        run: dotnet build src/Lean2Il -c Release

      - name: Re-check everything with Tenet and emit the assembly
        # On one runner the check covers Lean's own library under the project too; the others check the project.
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then FLAGS=""; else FLAGS="--trust-imports"; fi
          dotnet src/Lean2Il/bin/Release/net10.0/lean2il.dll lean $FLAGS

      - name: Tests
        run: dotnet test tests/LeanToDotNet.Tests -c Release --logger "console;verbosity=detailed"

      - name: Sample
        run: dotnet run --project samples/Invoice -c Release

      - name: VSIX
        if: matrix.os == 'ubuntu-latest'
        working-directory: vscode
        run: npx --yes @vscode/vsce@3 package --no-dependencies

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: lean-to-dot-net
          path: |
            lean/.lake/dotnet/
            vscode/*.vsix
